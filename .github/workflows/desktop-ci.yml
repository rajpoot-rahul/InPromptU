name: Desktop checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ${{ runner.os == 'Windows' && '1' || '' }}
      - run: npm run verify
      - name: Package the native Mac app
        if: runner.os == 'macOS'
        run: node scripts/package.cjs darwin "$(node -p 'process.arch')"
      - name: Check packaged resources and startup in all themes
        if: runner.os == 'macOS'
        run: node scripts/check-mac-startup.cjs
