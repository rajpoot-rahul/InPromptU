name: Pitch deck
on:
  push:
    branches: [main]
    paths: [pitch/**, docs/images/**, src/assets/logo.svg, .github/workflows/pitch-pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pitch-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}pitch/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Collect the deck and the images it uses
        run: |
          mkdir -p _site/pitch _site/src/assets _site/docs
          cp pitch/index.html _site/pitch/
          cp src/assets/logo.svg _site/src/assets/
          cp -R docs/images _site/docs/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=pitch/"><title>Impromptu</title><a href="pitch/">Impromptu pitch deck</a>\n' > _site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
