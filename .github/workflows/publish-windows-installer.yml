name: Publish tested Windows installer

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Windows installer workflow run ID
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-windows-installer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify tested build and publish installer
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: node scripts/publish-windows-installer.cjs
