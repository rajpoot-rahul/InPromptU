name: Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install build dependencies
        run: npm ci
      - name: Check source and run tests
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
      - name: Build Windows installer
        run: npm run installer:windows
      - name: Check install, launch and uninstall
        shell: pwsh
        run: ./scripts/check-windows-installer.ps1
      - name: Record installer checksum
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release/windows-installer/*-Setup.exe)
          if ($files.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          $file = $files[0]
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content release/windows-installer/SHA256SUMS-Windows-Installer.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: impromptu-windows-installer
          path: |
            release/windows-installer/*-Setup.exe
            release/windows-installer/SHA256SUMS-Windows-Installer.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
