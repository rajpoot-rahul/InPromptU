<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Impromptu mascot</title>
  <link rel="stylesheet" href="mascot.css">
</head>
<body>
  <div class="mascot-root" id="root" data-state="idle">
    <section class="mascot-panel" id="panel" hidden aria-label="Impromptu mascot">
      <header><strong>Impromptu</strong><span id="status">Ready</span><button type="button" class="close" id="close" aria-label="Close the menu">×</button></header>
      <div class="bubble" id="bubble" role="status" aria-live="polite" hidden><p id="bubble-text"></p><div class="bubble-detail" id="bubble-detail" hidden></div><div class="bubble-actions" id="bubble-actions"></div></div>
      <div class="actions" id="actions">
        <p class="group">SELECTED TEXT</p>
        <button type="button" data-action="selection-workspace">Improve the selected text</button>
        <button type="button" data-action="selection-knowledge">Send selection to Knowledge &amp; reply</button>
        <p class="group">THIS SCREEN · READ ON THIS COMPUTER</p>
        <button type="button" data-action="explain-screen">Explain this screen</button>
        <button type="button" data-action="read-page" id="read-page">Read this page (scrolls)</button>
        <form id="ask-form"><label for="ask" class="sr-only">Ask about this screen</label><input id="ask" maxlength="1000" placeholder="Ask about this screen…" autocomplete="off"><button type="submit">Ask</button></form>
        <button type="button" class="link" data-action="open-app">Open Impromptu</button>
      </div>
      <p class="privacy" id="privacy">Screen reading runs only when you click, and only on this computer.</p>
    </section>
    <button type="button" class="face" id="face" aria-label="Open the Impromptu mascot" aria-expanded="false"><span class="eyes"><i></i><i></i></span><b class="mouth"></b><span class="dot" id="dot" hidden></span></button>
  </div>
  <script src="mascot.js"></script>
</body>
</html>
